name: Update App Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "lib/**"
      - "store/**"
      - "types/**"
      - "scripts/frame-screenshot.mjs"
      - "package.json"
      - "app.json"
      - ".github/workflows/update-screenshot.yml"

permissions:
  contents: write

concurrency:
  group: update-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-screenshot:
    name: Capture & Frame iOS Simulator Screenshot
    runs-on: macos-15

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Setup CocoaPods cache & install pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Boot iPhone Simulator & configure status bar
        run: |
          set -eo pipefail
          SIM_UDID=$(python3 - <<'EOF'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          devices_by_runtime = json.loads(raw).get("devices", {})
          ios_runtimes = sorted(
              [k for k in devices_by_runtime if "iOS" in k],
              reverse=True,
          )
          preferred = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          for rt in ios_runtimes:
              devs = [
                  d for d in devices_by_runtime[rt]
                  if d.get("isAvailable") and "iPhone" in d.get("name", "")
              ]
              for name in preferred:
                  for d in devs:
                      if d["name"] == name:
                          print(d["udid"])
                          sys.exit(0)
              if devs:
                  print(devs[0]["udid"])
                  sys.exit(0)
          sys.exit("No available iPhone simulator found")
          EOF
          )
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Using simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100

      - name: Build Release app for iOS Simulator
        run: |
          set -eo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import sys, json; data = json.load(sys.stdin); print(data['workspace']['schemes'][0])")
          echo "Using workspace: $WORKSPACE | scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath ios/build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Launch app and capture raw simulator screenshot
        run: |
          set -eo pipefail
          APP_PATH=$(find "ios/build/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built simulator .app bundle"
            exit 1
          fi
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" de.mensaka.mobile
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot raw-simulator.png
          ls -lh raw-simulator.png

      - name: Frame screenshot inside iPhone bezel
        run: node scripts/frame-screenshot.mjs raw-simulator.png assets/screenshot-iphone.png

      - name: Upload framed screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: mensa-ka-iphone-screenshot
          path: |
            raw-simulator.png
            assets/screenshot-iphone.png
          retention-days: 14

      - name: Commit updated screenshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/screenshot-iphone.png && [ -z "$(git ls-files --others --exclude-standard assets/screenshot-iphone.png)" ]; then
            echo "Screenshot unchanged; skipping commit."
            exit 0
          fi
          git add assets/screenshot-iphone.png
          git commit -m "chore: update iPhone app screenshot [skip ci]"
          git push
