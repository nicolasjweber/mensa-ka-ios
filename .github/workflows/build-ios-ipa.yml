name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Swift / Xcode build configuration"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-release:
    name: Build iOS (${{ inputs.configuration || 'release' }})
    runs-on: xcode-27
    timeout-minutes: 30

    env:
      CONFIGURATION: ${{ inputs.configuration || 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --version

      - name: Build unsigned iOS .app with xtool
        run: |
          set -eo pipefail
          xtool dev build -c "$CONFIGURATION"

      - name: Package .app into unsigned .ipa
        run: |
          set -eo pipefail
          APP_PATH=$(find xtool .xtool-tmp -maxdepth 4 -name "*.app" 2>/dev/null | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle from xtool"
            find . -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf build-ipa MensaKA-unsigned.ipa
          mkdir -p build-ipa/Payload
          cp -R "$APP_PATH" build-ipa/Payload/
          cd build-ipa
          zip -q -r -y ../MensaKA-unsigned.ipa Payload
          ls -lh ../MensaKA-unsigned.ipa

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: MensaKA-unsigned-${{ inputs.configuration || 'release' }}-ipa
          path: MensaKA-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v') && env.CONFIGURATION == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MensaKA-unsigned.ipa --clobber
          else
            gh release create "$TAG" MensaKA-unsigned.ipa \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
